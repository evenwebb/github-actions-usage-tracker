name: Audit Workflows (PR)

on:
  pull_request:
    paths:
      - '.github/workflows/**'
    types: [opened, synchronize, reopened]

# Supersede in-flight runs when the PR branch updates (saves billable minutes on rapid pushes).
concurrency:
  group: audit-workflows-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Run auditor
        id: audit
        run: |
          python audit.py --markdown > audit_report.md || true
          echo "exit=$?" >> $GITHUB_OUTPUT

      - name: Post audit summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = fs.existsSync('audit_report.md')
              ? fs.readFileSync('audit_report.md', 'utf8')
              : '## GitHub Actions Audit\n\nNo workflow files changed or no issues found.';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('## GitHub Actions Cost & Risk Audit')
            );
            const commentBody = body + '\n\n---\n*Powered by [GitHub Actions Usage Tracker](https://github.com/evenwebb/github-actions-usage-tracker)*';
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
