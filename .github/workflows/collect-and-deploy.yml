name: Collect & Deploy

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Fetch 90 days (initial setup)'
        required: false
        default: false
        type: boolean
      days:
        description: 'Days of history to collect (overrides backfill)'
        required: false
        default: '2'
        type: string

# One run at a time: queue overlapping schedule/dispatch instead of canceling mid-collection.
concurrency:
  group: collect-deploy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GITHUB_ACTIONS_ALLOWANCE: ${{ vars.GITHUB_ACTIONS_ALLOWANCE || '2000' }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -q --disable-pip-version-check -r requirements.txt

      - name: Collect & generate
        env:
          ACTIONS_USAGE_TOKEN: ${{ secrets.ACTIONS_USAGE_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          APPRISE_URL: ${{ secrets.APPRISE_URL }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS || '365' }}
          GITHUB_ACTIONS_ALLOWANCE: ${{ vars.GITHUB_ACTIONS_ALLOWANCE || '2000' }}
        run: |
          DAYS="${{ github.event.inputs.days || '2' }}"
          BACKFILL="${{ github.event.inputs.backfill || 'false' }}"
          if [ "$BACKFILL" = "true" ] || [ "$DAYS" -gt 2 ]; then
            python collect.py --backfill --audit
          else
            python collect.py --audit
          fi
          python generate.py

      - name: Commit & push (if changed)
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update usage data [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
